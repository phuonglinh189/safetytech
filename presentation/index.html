<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Technology Adoption Maturity Assessment</title>
<link rel="stylesheet" href="../shared/styles.css?v=20260809-4" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="../shared/database-config.js"></script>
<script src="../shared/database.js"></script>
<script src="../shared/i18n.js?v=20260809-3"></script>
</head>
<body class="presentation-page">
<header class="top-bar assessment-header">
  <div class="assessment-logos" aria-label="Partner universities">
    <img src="../logo%20Manchester.jpg" alt="The University of Manchester" />
    <img src="../logo%20ntu.jpg" alt="National Taiwan University" />
  </div>
  <div class="assessment-header-title">
    <h1 id="pageTitle">Digital Technology Adoption Maturity Assessment</h1>
    <p id="pageSubtitle">Construction Safety Monitoring and Inspection Technologies</p>
  </div>
  <div class="assessment-header-actions">
    <a class="lang-link" id="langLink" href="#">中文</a>
  </div>
</header>

<div class="wrap">
  <div id="waitingView" class="center-hero">
    <div class="big-counter"><span id="countValue">0</span> / <span id="maxValue">0</span></div>
    <div class="big-counter-label" id="counterLabel"></div>
    <h2 style="margin-top:40px;" id="waitingHeading"></h2>
    <p class="subtitle" id="waitingSubtext"></p>
  </div>

  <div id="resultsView" style="display:none;">
    <h2 id="finalResultsHeading"></h2>
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label" id="overallCurrentLabel"></div>
        <div class="stat-value" id="overallCurrentValue">—</div>
        <div class="subtitle" id="overallCurrentLevelName"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label" id="overallTargetLabel"></div>
        <div class="stat-value" id="overallTargetValue">—</div>
        <div class="subtitle" id="overallTargetLevelName"></div>
      </div>
    </div>

    <div class="chart-card" style="max-width:520px; margin:0 auto 24px;">
      <canvas id="summaryRadarCanvas"></canvas>
    </div>

    <h3 id="domainBreakdownHeading"></h3>
    <div class="charts-grid" id="domainChartsGrid"></div>

    <div class="panel" style="margin-top:24px;">
      <h3 id="meaningHeading"></h3>
      <p id="meaningText" style="font-size:15px;"></p>
    </div>
  </div>
</div>

<script src="app.js?v=20260809-4"></script>
</body>
</html>
