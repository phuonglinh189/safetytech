<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Participant Information and Consent</title>
<link rel="stylesheet" href="../shared/styles.css?v=20260816-1" />
<script src="../shared/database-config.js"></script>
<script src="../shared/database.js?v=20260816-1"></script>
<script src="../shared/i18n.js?v=20260809-3"></script>
<script src="../shared/consent.js?v=20260816-1"></script>
</head>
<body class="consent-page">
<header class="top-bar assessment-header">
  <div class="assessment-logos" aria-label="Partner universities">
    <img src="../shared/assets/logo-manchester.png" alt="The University of Manchester" />
    <img src="../shared/assets/logo-ntu.png" alt="National Taiwan University" />
  </div>
  <div class="assessment-header-title">
    <h1 id="pageTitle">Participant Information and Consent</h1>
    <p id="pageSubtitle">Digital Technology Adoption Maturity Assessment</p>
  </div>
  <div class="assessment-header-actions">
    <a class="lang-link" id="langLink" href="#">中文</a>
  </div>
</header>

<main class="wrap">
  <div id="consentContent">
    <section class="panel consent-document" aria-labelledby="consentTitle">
      <div class="consent-document-title">
        <span aria-hidden="true">📄</span>
        <div>
          <h2 id="consentTitle"></h2>
          <p id="consentSalutation"></p>
        </div>
      </div>
      <p class="consent-introduction" id="consentIntroduction"></p>
      <div id="consentSections"></div>
    </section>

    <section class="panel consent-decision" aria-labelledby="decisionQuestion">
      <h2 id="decisionQuestion" tabindex="-1"></h2>
      <p class="note consent-existing-note" id="existingConsentNote" hidden></p>
      <div class="consent-actions">
        <button class="primary" id="agreeBtn" type="button"></button>
        <button class="secondary consent-decline-button" id="declineBtn" type="button"></button>
      </div>
      <p class="note warn consent-error" id="consentError" role="alert" hidden></p>
      <p class="consent-saving" id="consentSaving" aria-live="polite"></p>
    </section>
  </div>

  <section class="panel consent-declined" id="declinedPanel" aria-labelledby="declinedHeading" hidden>
    <div class="consent-declined-icon" aria-hidden="true">✓</div>
    <h2 id="declinedHeading" tabindex="-1"></h2>
    <p id="declinedMessage"></p>
    <button class="secondary" id="reviewBtn" type="button"></button>
  </section>
</main>

<script src="app.js?v=20260816-1"></script>
</body>
</html>
